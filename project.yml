name: Coach
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
targets:
  Coach:
    type: application
    platform: iOS
    sources: [Coach]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.coach
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Coach/Coach.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Coach
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Coach lee tu sueño, pasos, calorías, entrenamientos y frecuencia cardiaca para evaluar tu día frente a tu plan de entrenamiento."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Coach no escribe datos en Salud."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
