name: Coach
options:
  bundleIdPrefix: mx.coachdiario
  deploymentTarget:
    iOS: "17.0"
targets:
  Coach:
    type: application
    platform: iOS
    sources: [Coach]
    settings:
      base:
        # Con una cuenta gratis de Apple el identificador debe ser único; cámbialo si Xcode dice que ya está en uso
        PRODUCT_BUNDLE_IDENTIFIER: mx.coachdiario.hm.coach
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Coach/Coach.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Coach
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Coach lee tus pasos, sueño, calorías, entrenamientos, frecuencia cardiaca en reposo y peso para evaluar tu día frente a tu plan."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Coach no escribe datos en Salud."
        INFOPLIST_KEY_NSCameraUsageDescription: "Para tomar fotos de tus comidas."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir fotos de tus comidas."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
