name: Shortcut

on:
  push:
    paths: ["shortcut/**", ".github/workflows/shortcut.yml"]
  workflow_dispatch:

jobs:
  sign:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Firmar
        run: |
          sw_vers
          which shortcuts && shortcuts --help || true
          plutil -convert binary1 shortcut/test.plist -o test.shortcut
          shortcuts sign --mode anyone --input test.shortcut --output test-signed.shortcut 2>&1 | tee sign.log || true
          ls -la
          head -c 8 test-signed.shortcut | xxd || true
